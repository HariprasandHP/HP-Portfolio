<mat-toolbar color="primary" class="navbar sticky-header shadow">
  <div class="container-fluid d-flex justify-content-between align-items-center">

    <span class="navbar-brand fw-bold fs-4" style="color:orange;">Hari's Portfolio</span>

    <ul class="nav d-none d-md-flex">
      <li class="nav-item"><a class="nav-link text-white" routerLink="/home" routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }">Home</a></li>
      <li class="nav-item"><a class="nav-link text-white" routerLink="/about" routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }">About</a></li>
      <li class="nav-item"><a class="nav-link text-white" routerLink="/skills" routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }">Skills</a></li>
      <li class="nav-item"><a class="nav-link text-white" routerLink="/contact" routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }">Contact</a></li>
    </ul>

    <button mat-icon-button class="d-md-none text-white" (click)="toggleMenu()">
      <mat-icon>{{ isMenuOpen ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>
</mat-toolbar>

<div *ngIf="isMenuOpen" class="mobile-menu d-md-none bg-primary">
  <a class="nav-link d-block nav-link p-2" routerLink="/home" routerLinkActive="active-link"
    [routerLinkActiveOptions]="{ exact: true }" (click)="toggleMenu()">Home</a>
  <a class="nav-link d-block nav-link p-2" routerLink="/about" routerLinkActive="active-link"
    [routerLinkActiveOptions]="{ exact: true }" (click)="toggleMenu()">About</a>
  <a class="nav-link d-block nav-link p-2" routerLink="/skills" routerLinkActive="active-link"
    [routerLinkActiveOptions]="{ exact: true }" (click)="toggleMenu()">Skills</a>
  <a class="nav-link d-block nav-link p-2" routerLink="/contact" routerLinkActive="active-link"
    [routerLinkActiveOptions]="{ exact: true }" (click)="toggleMenu()">Contact</a>
</div>
